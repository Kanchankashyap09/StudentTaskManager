spring:
  application:
    name: studyflow-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/studyflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:studyflow}
    password: ${DB_PASSWORD:studyflow}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

logging:
  level:
    com.studyflow: INFO
